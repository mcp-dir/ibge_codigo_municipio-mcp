# Smithery configuration for IBGE: Código de Município
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ibge_codigo_municipio

name: ibge_codigo_municipio-mcp
displayName: "IBGE: Código de Município"
description: >
  IBGE: Código de Município, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ibge_codigo_municipio-mcp
repository: https://github.com/mcp-dir/ibge_codigo_municipio-mcp

tags:
  - ibge_codigo_municipio
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ibge_codigo_municipio

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ibge_codigo_municipio/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
